# The Galaxy A56's reverse adb tunnel (127.0.0.1:7555). Added 05/10/2026.
# Read before 10-auth.conf, so these values win (sshd uses the first value it reads).
#
# Survive the home router's nightly restart (up to ~4 min without internet, just before
# 05:00): a silent session is kept for 5 minutes (15 s x 20) instead of being dropped.
ClientAliveInterval 15
ClientAliveCountMax 20
# Key login is allowed ONLY for the phone's tunnel key in this root-owned file. That key is
# restricted to listening on 7555 via /usr/local/bin/phone_tunnel_session (which also lets
# the phone's newest connection replace a dead one). Password login is unchanged.
PubkeyAuthentication yes
AuthorizedKeysFile /etc/ssh/phone_tunnel_authorized_keys
